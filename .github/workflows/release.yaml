# Bump version with Commitizen (conventional commits → semver tags v$version),
# push the release commit and tag, create a GitHub Release, and publish docs.
# PyPI publishing was removed — this repo ships as an application, not a library.
#
# Optional: set secret RELEASE_PUSH_TOKEN (PAT with repo scope) on checkout/push
# if you need tag pushes to trigger other workflows. GITHUB_TOKEN pushes do not
# chain-trigger workflows by default.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          version: "0.11.7"

      - name: Sync dev dependencies
        run: |
          uv sync --frozen --group dev

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Record version before release
        id: vbefore
        run: |
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Bump version and changelog (Commitizen)
        run: |
          set -euo pipefail
          # Exit code 21 = no commits eligible for a release (not an error).
          uv run cz --no-raise 21 bump --yes --changelog

      - name: Detect release
        id: released
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" = "${{ steps.vbefore.outputs.sha }}" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "No releasable conventional commits since last tag."
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
            echo "tag=v$(uv version --short)" >> "$GITHUB_OUTPUT"
          fi

      - name: Push release commit and tags
        if: steps.released.outputs.bumped == 'true'
        run: |
          git push origin HEAD:main --follow-tags

      - name: Build release notes
        if: steps.released.outputs.bumped == 'true'
        run: |
          uv run cz changelog --dry-run "${{ steps.released.outputs.version }}" > .changelog.md

      - name: Create GitHub Release
        if: steps.released.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.released.outputs.tag }}" --notes-file .changelog.md

      - name: Build and publish documentation (Mike → gh-pages)
        if: steps.released.outputs.bumped == 'true'
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          uv sync --frozen --group docs --group dev
          VERSION="${{ steps.released.outputs.version }}"
          RELEASE_IS_PRE="$(uv run python -c 'import packaging.version as pv; print(str(pv.Version("'"${VERSION}"'").is_prerelease).lower())')"
          uv run python scripts/generate_cli_reference.py model_gateway --name model-gateway
          uv run python scripts/generate_index.py
          uv run mkdocs build --strict
          if [ "$RELEASE_IS_PRE" = "true" ]; then
            uv run mike deploy --push --update-aliases "$VERSION" latest
          else
            uv run mike deploy --push --update-aliases "$VERSION" latest stable
          fi

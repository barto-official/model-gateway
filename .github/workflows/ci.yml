name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          version: "0.11.7"

      - name: Sync test dependencies
        run: |
          uv sync --frozen --group dev

      - name: Run tests
        run: |
          uv run pytest --markdown-docs docs tests

  docs-build:
    runs-on: ubuntu-latest
    env:
      DISABLE_MKDOCS_2_WARNING: "true"
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Build MkDocs site
        #for strict mode (warning becomes error): uv run mkdocs build --strict
        run: |
          set -euo pipefail

          uv sync --frozen --group docs

          uv run python scripts/generate_cli_reference.py model_gateway --name model-gateway --check

          uv run python scripts/generate_index.py

          git diff --exit-code -- docs/architecture/adr/index.md docs/rfc/index.md

          uv run mkdocs build

      - name: Upload built site for link checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mkdocs-site
          path: site

  link-check-internal:
    runs-on: ubuntu-latest
    needs: docs-build

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download built site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mkdocs-site
          path: site

      - name: Prepare lychee root for MkDocs site_url base path
        run: |
          mkdir -p lychee-root
          ln -sfn "${GITHUB_WORKSPACE}/site" "${GITHUB_WORKSPACE}/lychee-root/model-gateway"

      - name: Internal link scan (offline)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          args: --config .lychee.toml --root-dir "${{ github.workspace }}/lychee-root" --offline docs/ README.md site/

  link-check-external:
    runs-on: ubuntu-latest
    needs: docs-build

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Download built site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mkdocs-site
          path: site

      - name: Prepare lychee root for MkDocs site_url base path
        run: |
          mkdir -p lychee-root
          ln -sfn "${GITHUB_WORKSPACE}/site" "${GITHUB_WORKSPACE}/lychee-root/model-gateway"

      - name: External link scan (offline + online)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          args: --config .lychee.toml --root-dir "${{ github.workspace }}/lychee-root" site/ docs/ README.md

  prek:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Run prek (all files)
        run: |
          uv sync --frozen --group dev --group docs
          uv run prek run --all-files
